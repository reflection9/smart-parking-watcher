services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-parking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: smart-parking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: smart-parking-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: abcdefghijklmnopqrstuv
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smart-parking-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  user-db-migrate:
    image: postgres:16-alpine
    container_name: smart-parking-user-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/user-service/migrations:/migrations:ro
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432 -U postgres -d user_service_db; do sleep 2; done;
      psql postgresql://postgres:postgres@postgres:5432/user_service_db -v ON_ERROR_STOP=1 -f /migrations/001_create_users.sql
      "
    restart: "no"

  parking-db-migrate:
    image: postgres:16-alpine
    container_name: smart-parking-parking-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/parking-service/migrations:/migrations:ro
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432 -U postgres -d parking_service_db; do sleep 2; done;
      psql postgresql://postgres:postgres@postgres:5432/parking_service_db -v ON_ERROR_STOP=1 -f /migrations/001_create_zones.sql
      "
    restart: "no"

  subscription-db-migrate:
    image: postgres:16-alpine
    container_name: smart-parking-subscription-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/subscription-service/migrations:/migrations:ro
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432 -U postgres -d subscription_service_db; do sleep 2; done;
      psql postgresql://postgres:postgres@postgres:5432/subscription_service_db -v ON_ERROR_STOP=1 -f /migrations/001_create_subscriptions.sql
      "
    restart: "no"

  reservation-db-migrate:
    image: postgres:16-alpine
    container_name: smart-parking-reservation-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/reservation-service/migrations:/migrations:ro
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432 -U postgres -d reservation_service_db; do sleep 2; done;
      for file in /migrations/*.sql; do
        psql postgresql://postgres:postgres@postgres:5432/reservation_service_db -v ON_ERROR_STOP=1 -f $$file;
      done
      "
    restart: "no"

  notification-db-migrate:
    image: postgres:16-alpine
    container_name: smart-parking-notification-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/notification-service/migrations:/migrations:ro
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432 -U postgres -d notification_service_db; do sleep 2; done;
      psql postgresql://postgres:postgres@postgres:5432/notification_service_db -v ON_ERROR_STOP=1 -f /migrations/001_create_notifications.sql
      "
    restart: "no"

  user-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: smart-parking-user-service
    depends_on:
      user-db-migrate:
        condition: service_completed_successfully
    environment:
      APP_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: user_service_db
    ports:
      - "8081:8081"
    restart: unless-stopped

  parking-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: parking-service
    container_name: smart-parking-parking-service
    depends_on:
      parking-db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      APP_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: parking_service_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_SPOT_TOPIC: spot-status-events
      KAFKA_PARKING_COMMAND_TOPIC: parking-spot-commands
      KAFKA_PARKING_COMMAND_GROUP_ID: parking-service-commands
    ports:
      - "8083:8083"
    restart: unless-stopped

  subscription-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: subscription-service
    container_name: smart-parking-subscription-service
    depends_on:
      subscription-db-migrate:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      parking-service:
        condition: service_started
    environment:
      APP_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: subscription_service_db
      USER_SERVICE_URL: http://user-service:8081
      PARKING_SERVICE_URL: http://parking-service:8083
    ports:
      - "8082:8082"
    restart: unless-stopped

  reservation-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: reservation-service
    container_name: smart-parking-reservation-service
    depends_on:
      reservation-db-migrate:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      parking-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      APP_PORT: 8086
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: reservation_service_db
      USER_SERVICE_URL: http://user-service:8081
      PARKING_SERVICE_URL: http://parking-service:8083
      KAFKA_BROKERS: kafka:9092
      KAFKA_RESERVATION_TOPIC: reservation-lifecycle-events
      KAFKA_PARKING_COMMAND_TOPIC: parking-spot-commands
      KAFKA_SPOT_TOPIC: spot-status-events
      KAFKA_SPOT_GROUP_ID: reservation-service-spots
      RESERVATION_TTL_MINUTES: 5
    ports:
      - "8086:8086"
    restart: unless-stopped

  event-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: event-service
    container_name: smart-parking-event-service
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_PORT: 8084
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: event_service_db
      MONGO_COLLECTION: parking_events
      KAFKA_BROKERS: kafka:9092
      KAFKA_RESERVATION_TOPIC: reservation-lifecycle-events
      KAFKA_RESERVATION_GROUP_ID: event-service-reservations
      KAFKA_SPOT_TOPIC: spot-status-events
      KAFKA_SPOT_GROUP_ID: event-service-spots
    ports:
      - "8084:8084"
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: smart-parking-notification-service
    depends_on:
      notification-db-migrate:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      subscription-service:
        condition: service_started
    environment:
      APP_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notification_service_db
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      USER_SERVICE_URL: http://user-service:8081
      EMAIL_TRANSPORT: log
      EMAIL_FROM: noreply@smartparking.local
      SMTP_HOST: localhost
      SMTP_PORT: 587
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      KAFKA_BROKERS: kafka:9092
      KAFKA_SPOT_TOPIC: spot-status-events
      KAFKA_GROUP_ID: notification-service-spots
    ports:
      - "8085:8085"
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
