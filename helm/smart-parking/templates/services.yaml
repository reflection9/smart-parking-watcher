{{- range $service := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  labels:
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/component: {{ $service.component }}
{{ include "smart-parking.labels" $ | indent 4 }}
spec:
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: {{ $service.port }}
  selector:
    app.kubernetes.io/name: {{ $service.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  labels:
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/component: {{ $service.component }}
{{ include "smart-parking.labels" $ | indent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $service.name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ $service.port | quote }}
{{- if $.Values.global.istio.inject }}
        sidecar.istio.io/inject: "true"
{{- end }}
{{- if $.Values.global.istio.holdApplicationUntilProxyStarts }}
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
{{- end }}
      labels:
        app.kubernetes.io/name: {{ $service.name }}
        app.kubernetes.io/component: {{ $service.component }}
    spec:
{{- if $service.initWaitFor }}
      initContainers:
{{- range $wait := $service.initWaitFor }}
        - name: {{ $wait.name }}
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ $wait.host }} {{ $wait.port }}; do echo waiting for {{ $wait.host }}; sleep 2; done"]
{{- end }}
{{- end }}
      containers:
        - name: {{ $service.name }}
          image: "{{ $.Values.global.image.registry }}/{{ $.Values.global.image.repositoryPrefix }}/{{ $service.imageName }}:{{ $.Values.global.image.tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          env:
{{- range $env := $service.env }}
            - name: {{ $env.name }}
{{- if hasKey $env "value" }}
              value: {{ $env.value | quote }}
{{- else if hasKey $env "configMapKeyRef" }}
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: {{ $env.configMapKeyRef }}
{{- else if hasKey $env "secretKeyRef" }}
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: {{ $env.secretKeyRef }}
{{- end }}
{{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ $service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ $service.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
{{ toYaml $service.resources | indent 12 }}
{{- end }}
