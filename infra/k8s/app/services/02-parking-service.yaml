apiVersion: v1
kind: Service
metadata:
  name: parking-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: parking-service
    app.kubernetes.io/component: backend
spec:
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app.kubernetes.io/name: parking-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: parking-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parking-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8083"
      labels:
        app.kubernetes.io/name: parking-service
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: parking-service
          image: localhost:5001/smart-parking/parking-service:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: APP_PORT
              value: "8083"
            - name: DB_NAME
              value: parking_service_db
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: DB_PASSWORD
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_BROKERS
            - name: KAFKA_SPOT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_SPOT_TOPIC
            - name: KAFKA_PARKING_COMMAND_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_PARKING_COMMAND_TOPIC
            - name: KAFKA_PARKING_COMMAND_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_PARKING_COMMAND_GROUP_ID
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
