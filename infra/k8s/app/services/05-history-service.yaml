apiVersion: v1
kind: Service
metadata:
  name: history-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: history-service
    app.kubernetes.io/component: backend
spec:
  ports:
    - name: http
      port: 8084
      targetPort: 8084
  selector:
    app.kubernetes.io/name: history-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: history-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: history-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8084"
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app.kubernetes.io/name: history-service
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
        - name: wait-for-minio
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z minio 9000; do echo waiting for minio; sleep 2; done"]
      containers:
        - name: history-service
          image: localhost:5001/smart-parking/history-service:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: APP_PORT
              value: "8084"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: MONGO_URI
            - name: MONGO_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: MONGO_DB_NAME
            - name: MONGO_COLLECTION
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: MONGO_COLLECTION
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_BROKERS
            - name: KAFKA_RESERVATION_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_RESERVATION_TOPIC
            - name: KAFKA_RESERVATION_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_RESERVATION_GROUP_ID_HISTORY
            - name: KAFKA_SPOT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_SPOT_TOPIC
            - name: KAFKA_SPOT_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_SPOT_GROUP_ID_HISTORY
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: MINIO_SECRET_KEY
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: MINIO_BUCKET
            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: MINIO_USE_SSL
            - name: ARCHIVE_AFTER_HOURS
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: ARCHIVE_AFTER_HOURS
            - name: ARCHIVE_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: ARCHIVE_INTERVAL_SECONDS
            - name: ARCHIVE_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: ARCHIVE_BATCH_SIZE
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
