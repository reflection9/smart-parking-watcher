apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/name: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: user-service
          image: localhost:5001/smart-parking/user-service:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: APP_PORT
              value: "8081"
            - name: DB_NAME
              value: user_service_db
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: DB_PASSWORD
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
