apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
spec:
  ports:
    - name: http
      port: 8085
      targetPort: 8085
  selector:
    app.kubernetes.io/name: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8085"
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
        - name: wait-for-user-service
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z user-service 8081; do echo waiting for user-service; sleep 2; done"]
        - name: wait-for-subscription-service
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z subscription-service 8082; do echo waiting for subscription-service; sleep 2; done"]
      containers:
        - name: notification-service
          image: localhost:5001/smart-parking/notification-service:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: APP_PORT
              value: "8085"
            - name: DB_NAME
              value: notification_service_db
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: DB_PASSWORD
            - name: SUBSCRIPTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: SUBSCRIPTION_SERVICE_URL
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: USER_SERVICE_URL
            - name: EMAIL_TRANSPORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: EMAIL_TRANSPORT
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: EMAIL_FROM
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-app-secret
                  key: SMTP_PASSWORD
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_BROKERS
            - name: KAFKA_SPOT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_SPOT_TOPIC
            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: KAFKA_GROUP_ID_NOTIFICATION
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
