apiVersion: batch/v1
kind: Job
metadata:
  name: user-db-migrate
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -p 5432 -U postgres -d user_service_db; do sleep 2; done
              psql postgresql://postgres:${PGPASSWORD}@postgres:5432/user_service_db -v ON_ERROR_STOP=1 -f /migrations/001_create_users.sql
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: user-service-migrations
---
