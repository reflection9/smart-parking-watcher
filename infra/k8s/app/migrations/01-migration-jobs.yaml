apiVersion: batch/v1
kind: Job
metadata:
  name: reservation-db-migrate
  namespace: smart-parking
  labels:
    app.kubernetes.io/name: reservation-service
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -p 5432 -U postgres -d reservation_service_db; do sleep 2; done
              for file in /migrations/*.sql; do
                psql postgresql://postgres:${PGPASSWORD}@postgres:5432/reservation_service_db -v ON_ERROR_STOP=1 -f ${file}
              done
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: reservation-service-migrations
---
