apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: kubernetes-pods-smart-parking
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - smart-parking
        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            regex: "true"
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            regex: (.+)
            target_label: __metrics_path__
          - action: replace
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: job
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: service
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name

      - job_name: kubernetes-pods-observability
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - observability
        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            regex: "true"
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            regex: (.+)
            target_label: __metrics_path__
          - action: replace
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: job
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: service
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name
  alerts.yml: |-
    groups:
      - name: smart-parking-alerts
        rules:
          - alert: SmartParkingServiceDown
            expr: up{job=~"user-service|parking-service|subscription-service|reservation-service|history-service|notification-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.job }} is down"
              description: "Prometheus cannot scrape {{ $labels.job }} for more than 1 minute."

          - alert: HighHttp5xxRate
            expr: |
              (
                sum by (service) (rate(smart_parking_http_requests_total{status=~"5.."}[5m]))
                /
                clamp_min(sum by (service) (rate(smart_parking_http_requests_total[5m])), 0.001)
              ) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High 5xx rate on {{ $labels.service }}"
              description: "More than 5% of HTTP requests ended with 5xx for 5 minutes."

          - alert: HighHttpP95Latency
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, service) (
                  rate(smart_parking_http_request_duration_seconds_bucket[5m])
                )
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on {{ $labels.service }}"
              description: "p95 latency is above 1 second for 5 minutes."
