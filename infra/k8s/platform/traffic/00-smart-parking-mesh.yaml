apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: user-service-read-retries
  namespace: smart-parking
spec:
  hosts:
    - user-service
  http:
    - match:
        - method:
            exact: GET
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,cancelled,5xx,reset
      timeout: 3s
      route:
        - destination:
            host: user-service
