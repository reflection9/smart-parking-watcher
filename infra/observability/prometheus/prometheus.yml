global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: parking-service
    static_configs:
      - targets: ["parking-service:8083"]

  - job_name: subscription-service
    static_configs:
      - targets: ["subscription-service:8082"]

  - job_name: reservation-service
    static_configs:
      - targets: ["reservation-service:8086"]

  - job_name: history-service
    static_configs:
      - targets: ["history-service:8084"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8085"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
