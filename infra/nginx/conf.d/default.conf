server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "gateway ok\n";
    }

    location = /users/register {
        limit_req zone=register_limit burst=5 nodelay;
        proxy_pass http://user_service;
    }

    location = /users/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://user_service;
    }

    location /users/ {
        proxy_pass http://user_service;
    }

    location = /subscriptions {
        limit_req zone=subscription_limit burst=10 nodelay;
        proxy_pass http://subscription_service;
    }

    location /subscriptions/ {
        proxy_pass http://subscription_service;
    }

    location = /reservations {
        limit_req zone=reservation_limit burst=10 nodelay;
        proxy_pass http://reservation_service;
    }

    location ~ ^/reservations/[^/]+/(confirm|cancel|expire)$ {
        limit_req zone=reservation_limit burst=10 nodelay;
        proxy_pass http://reservation_service;
    }

    location /reservations/ {
        proxy_pass http://reservation_service;
    }

    location = /history/archive {
        limit_req zone=archive_limit burst=2 nodelay;
        proxy_pass http://history_service;
    }

    location = /events {
        proxy_pass http://history_service;
    }

    location /history/ {
        proxy_pass http://history_service;
    }

    location /events/ {
        proxy_pass http://history_service;
    }

    location = /zones {
        proxy_pass http://parking_service;
    }

    location /zones/ {
        proxy_pass http://parking_service;
    }

    location /spots/ {
        proxy_pass http://parking_service;
    }

    location = /notifications {
        proxy_pass http://notification_service;
    }

    location /notifications/ {
        proxy_pass http://notification_service;
    }

    location / {
        return 404;
    }
}
