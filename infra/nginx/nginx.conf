worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens off;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    limit_req_status 429;

    upstream user_service {
        least_conn;
        server user-service:8081;
        keepalive 16;
    }

    upstream parking_service {
        least_conn;
        server parking-service:8083;
        keepalive 16;
    }

    upstream subscription_service {
        least_conn;
        server subscription-service:8082;
        keepalive 16;
    }

    upstream reservation_service {
        least_conn;
        server reservation-service:8086;
        keepalive 16;
    }

    upstream history_service {
        least_conn;
        server history-service:8084;
        keepalive 16;
    }

    upstream notification_service {
        least_conn;
        server notification-service:8085;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=subscription_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=reservation_limit:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=archive_limit:10m rate=2r/m;

    include /etc/nginx/conf.d/*.conf;
}
